name: deploy-book

# Run this when the master or main branch changes
on:
  push:
    branches:
      - master
      - main
    # If your Git repository has the Jupyter Book within some-subfolder next to
    # unrelated files, you can make this run only if a file within that specific
    # folder has been modified.
    #
    # paths:
    # - some-subfolder/**

# This job installs dependencies, builds the book, and pushes it to `gh-pages`
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install lint tooling
        run: |
          pip install --upgrade pip
          pip install ruff

      - name: Ruff check
        # TODO(phase-3): include notebooks once RNG/unpacked-variable cleanup lands
        run: ruff check filters models plots simulators symbols tests

      - name: Ruff format check
        run: ruff format --check filters models plots simulators symbols tests

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install package + type checker
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,sim]"
          pip install ty

      - name: ty check
        # Every diagnostic is an error: the pyproject.toml [tool.ty.rules]
        # block already promotes the interesting codes to error level, and we
        # want the CI gate to fail on anything ty reports in strict mode.
        run: ty check --error-on-warning filters models plots simulators symbols tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install package + dev extras
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,sim]"

      - name: Pytest regression suite
        run: pytest -q

  deploy-book:
    needs: [lint, types, test]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Install dependencies
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Build the book
      - name: Build the book
        run: |
          jupyter-book build .

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Upload the book's HTML as an artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./_build/html"

      # Deploy the book's HTML to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
