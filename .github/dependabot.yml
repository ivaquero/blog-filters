version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: '/'
    schedule:
      interval: monthly
    ignore:
      # Jupyter Book majors are full rewrites (2.0 replaced Sphinx with a
      # mystmd/Node pipeline and silently stopped emitting _build/html).
      # requirements.txt already bounds `>=2,<3`; keep major bumps manual so a
      # new engine never lands through an auto-merged PR.
      - dependency-name: 'jupyter-book'
        update-types: ['version-update:semver-major']
