[project]
name = "blog-filters"
version = "0.1.0"
description = "Companion code and notebooks for the blog-filters series on Kalman-family estimators"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "scipy>=1.10",
  "sympy>=1.12",
]

[project.optional-dependencies]
book = [
  "jupyter-book<2",
]
sim = [
  "pandas>=2.0",
  "PyYAML>=6.0",
]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filters", "models", "plots", "simulators", "symbols"]

[tool.ruff]
fix = true
target-version = "py310"
line-length = 88

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 60
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
extend-select = [
  "DTZ",
  "E",
  "F",
  "I",
  "ISC",
  "NPY",
  "PERF",
  "RUF",
  "S",
  "SIM",
  "TID",
  "UP",
  "W",
]
fixable = ["ALL"]
ignore = [
  "E501",
  "ISC001",
  "RUF001",
  "RUF002",
  "RUF003",
  "S101",
  "S603",
  # Mathematical code legitimately uses `I` for identity matrices.
  "E741",
  # Intentional patterns retained from upstream filterpy.
  "PERF203",
  "BLE001",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
force-wrap-aliases = false
split-on-trailing-comma = false
order-by-type = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
