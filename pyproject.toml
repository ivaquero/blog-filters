[project]
name = "blog-filters"
version = "0.1.0"
description = "Companion code and notebooks for the blog-filters series on Kalman-family estimators"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "matplotlib>=3.11",
  "numpy>=2.5",
  "scipy>=1.18",
  "sympy>=1.14",
]

[project.optional-dependencies]
book = [
  "jupyter-book>=2.1,<3",
  "jupyter-server>=2.21",
  "ipykernel>=7",
]
dev = [
  "ruff>=0.17",
  "pytest>=9.2",
  "ty==0.0.104",
]
sim = [
  "pandas>=3.1",
  "PyYAML>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filters", "models", "plots", "simulators", "symbols"]

[tool.hatch.build.targets.wheel.force-include]
"filters/py.typed" = "filters/py.typed"
"models/py.typed" = "models/py.typed"
"plots/py.typed" = "plots/py.typed"
"simulators/py.typed" = "simulators/py.typed"
"symbols/py.typed" = "symbols/py.typed"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
fix = true
target-version = "py314"
line-length = 88

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 60
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
extend-select = [
  "ANN",
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "FA",
  "FURB",
  "I",
  "ICN",
  "ISC",
  "LOG",
  "NPY",
  "PERF",
  "PGH",
  "PIE",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "TID",
  "TRY",
  "UP",
  "W",
]
fixable = ["ALL"]
ignore = [
  "E501",
  "ISC001",
  "RUF001",
  "RUF002",
  "RUF003",
  "S101",
  "S603",

  "E741",

  "PERF203",
  "BLE001",

  "ANN401",
  "PT006",
  "PT007",
  "PT011",
  "PT012",
  "PT013",
  "TRY003",
  "TRY300",
  "TRY301",
]

[tool.ruff.lint.per-file-ignores]
"filters/*" = [
  "ANN",
]
"filters/_typing.py" = ["ANN401"]
"filters/kalman.py" = ["ANN401"]
"plots/*" = ["ANN"]
"simulators/*" = ["ANN"]
"symbols/*" = ["ANN"]
"tests/*" = [
  "ANN",
  "ARG",
  "S101",
  "SLF001",
  "PLR2004",
  "B008",
  "DTZ",
]
"scripts/*" = ["ANN", "ARG", "INP", "S"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
force-wrap-aliases = false
split-on-trailing-comma = false
order-by-type = true
known-first-party = ["filters", "models", "plots", "shared", "simulators", "symbols"]

[tool.ty.src]
respect-ignore-files = true
exclude = ["_build", "build"]

[tool.ty.rules]
import-not-found = "error"
incompatible-method-override = "error"
invalid-assignment = "error"
invalid-type-form = "error"
missing-attribute = "error"
not-subscriptable = "error"
unsupported-operator = "error"
